name: Native loader compatibility builds
on:
  push:
    paths: ['src/**', 'src120/**', 'loaders/**', 'scripts/build_native*.py', 'scripts/native_projects.py', 'scripts/named_port.py', 'scripts/ports.py', 'fabric.mod.json', '.github/workflows/native-compatibility.yml']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: targets
        env:
          EVATEX_REMAINING_NATIVE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[remaining-native]') }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          targets=json.loads(Path('loaders/targets.json').read_text())
          rows=[{'minecraft':mc,'loader':loader} for mc,loaders in targets.items() for loader,revision in loaders.items() if revision]
          # Explicit release-expansion recovery runs only unpublished targets.
          # Normal pushes/PRs retain the complete compile matrix.
          if os.environ.get('EVATEX_REMAINING_NATIVE')=='true':
              import urllib.request, time
              version=json.loads(Path('fabric.mod.json').read_text())['version']
              url='https://api.modrinth.com/v2/project/RWtUJXS3/version?check='+str(time.time())
              with urllib.request.urlopen(url,timeout=30) as response:
                  published={item['version_number'] for item in json.load(response)}
              rows=[row for row in rows if f"{version}+mc{row['minecraft']}.{row['loader']}" not in published]
          def priority(row):
              mc=row['minecraft']
              if mc=='1.21.11':return 0
              if mc.startswith('26.'):return 1
              if row['loader']=='neoforge' and mc in ('1.20.2','1.20.3','1.20.5'):return 4
              return 2 if mc.startswith('1.21') else 3
          rows.sort(key=priority)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('matrix='+json.dumps({'include':rows})+'\n')
          PY
  compile:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Remember Java 21 for ForgeGradle 6
        run: echo "EVATEX_GRADLE_JAVA21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile exact native loader API
        run: |
          set -o pipefail
          if python scripts/build_native.py --loader '${{ matrix.loader }}' --minecraft '${{ matrix.minecraft }}' --compile-only 2>&1 | tee native-build.log; then
            exit 0
          fi
          # One bounded retry for an upstream download failure; compiler errors
          # are surfaced immediately and are never converted into success.
          if rg -q 'Connection reset|HttpTimeoutException|request timed out' native-build.log; then
            python scripts/build_native.py --loader '${{ matrix.loader }}' --minecraft '${{ matrix.minecraft }}' --compile-only 2>&1 | tee -a native-build.log
          else
            exit 1
          fi
      - name: Save development build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            native-build.log
            loaders/*/build/libs/*.jar
            build/native-projects/*/*/build/libs/*.jar
            loaders/*/build/reports/
            build/native-projects/*/*/build/reports/
          if-no-files-found: ignore
