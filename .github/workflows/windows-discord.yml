name: Windows Discord IPC
on:
  push:
    paths: ['src/com/videomenu/*Discord*.java', 'tests/WindowsDiscordPresenceRegression.java', 'scripts/test_windows_discord.py', '.github/workflows/windows-discord.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pipe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify actual Win32 Discord pipe transport
        run: python scripts/test_windows_discord.py
