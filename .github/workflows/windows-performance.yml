name: Windows playback performance
on:
  workflow_dispatch:
  push:
    paths: ['tooling/WindowsPlaybackBenchmark.java', 'tooling/windows_benchmark.py', 'tooling/windows-handoff/**', '.github/workflows/windows-performance.yml']
permissions:
  contents: read
jobs:
  windows-playback:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate native Windows process and GPU collector
        shell: pwsh
        run: |
          & ./tooling/windows-handoff/collect-performance.ps1 -GamePid $PID -Seconds 15 -OutputDirectory ./build/collector-check
          if (!(Test-Path ./build/collector-check/hardware.json)) { throw 'Missing hardware report' }
          $rows = @(Import-Csv ./build/collector-check/processes.csv)
          # A cold GPU WMI query can take longer than the sampling window.
          if ($rows.Count -lt 1) { throw 'Missing process samples' }
      - name: Native Windows decoder and fallback regressions
        run: python scripts/test_desktop.py
      - name: Measure 1080p and 720p playback using the actual decoder and TCP transport
        run: python tooling/windows_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-playback-measurements
          path: build/windows-performance/report.json
